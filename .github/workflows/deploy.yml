name: Auto-Deploy to Coolify

on:
  push:
    branches:
      - main
  # Lets a deploy be retried without an empty commit — needed after fixing the
  # token, and for redeploying a commit that landed while the token was missing.
  workflow_dispatch:

env:
  COOLIFY_HOST: https://dash.build3.online
  COOLIFY_APP_UUID: js5u9eaxwdjce41bct38i0sv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Coolify answers an unauthenticated deploy call with 404 "Not found."
      # rather than 401, so a missing secret looked exactly like a wrong URL and
      # 13 consecutive runs were misread as such. Fail loudly on the real cause.
      - name: Check the deploy token is present
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_TOKEN is not set on this repository, so the deploy cannot be authenticated. Add it under Settings > Secrets and variables > Actions > New repository secret, then re-run this workflow."
            exit 1
          fi

      # Coolify v4 exposes deployment as GET /api/v1/deploy?uuid=... The previous
      # POST /api/v1/applications/{uuid}/deploy route does not exist on 4.x: it
      # returns the same 404 as a nonsense path, verified against this instance.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -sS --fail-with-body \
            "${COOLIFY_HOST}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json"
